plugins {
    id 'com.android.application'
    id "org.owasp.dependencycheck" version "8.2.1"
}

apply plugin: 'org.owasp.dependencycheck'

dependencyCheck {
    //formats = listOf("HTML", "XML", "JSON") // Generate reports in HTML, JSON and XML format
    //autoUpdate=false
    format='HTML'
    /*
    nvd {
        apiKey = "652174af-017b-4700-bea9-99776b01bc25"
        //delay = 16000
    }
    */
}

android {
    namespace 'com.e510.incidencelibraryandroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.e510.incidencelibraryandroid"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(path: ':incidenceLibrary')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}