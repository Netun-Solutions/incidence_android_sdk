buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
    }
}

allprojects {
    // repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
